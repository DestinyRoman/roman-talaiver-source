<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman's Game Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <h1 class="text-5xl font-bold mb-4 tracking-tighter">Roman's Game Lab</h1>
    <p class="text-slate-400 mb-10">Welcome to my development workspace.</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
        <a href="/games/rock-tycoon/" class="group flex items-start gap-4 p-6 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 hover:-translate-y-0.5 transition">
            <div class="shrink-0 w-14 h-14 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-900/40 group-hover:scale-105 transition">
                <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M10 3 8 9l4 12 4-12-2-6"/>
                </svg>
            </div>
            <div>
                <h2 class="text-xl font-bold text-blue-400">Deep Rock Tycoon</h2>
                <p class="text-sm text-slate-500 mt-1">Version 2.0 - Mining Simulator - built with Gemini</p>
            </div>
        </a>
        <a href="/planner/" class="group flex items-start gap-4 p-6 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 hover:-translate-y-0.5 transition">
            <div class="shrink-0 w-14 h-14 rounded-xl bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center shadow-lg shadow-blue-900/40 group-hover:scale-105 transition">
                <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/><path d="m8.5 15 2.2 2.2 4.8-4.7"/>
                </svg>
            </div>
            <div>
                <h2 class="text-xl font-bold text-blue-400">Planner</h2>
                <p class="text-sm text-slate-500 mt-1">Homework, quizzes, tests and projects. Board + calendar.</p>
            </div>
        </a>
    </div>
</body>
</html>
